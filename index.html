<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <script src="install.js"></script>
    <title>Sederhana Sheet</title>
    <style>
        body { font-family: sans-serif; padding: 15px; margin: 0; background: #f8f9fa; }
        .toolbar { margin-bottom: 15px; display: flex; gap: 10px; }
        .btn { padding: 8px 12px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .btn:hover { background: #f0f0f0; }
        .btn-green { background: #107c41; color: white; border: none; }
        .btn-green:hover { background: #0b5930; }
        
        .table-container { overflow-x: auto; max-height: 80vh; border: 1px solid #ddd; background: white; }
        table { border-collapse: collapse; min-width: 100%; table-layout: fixed; }
        th, td { border: 1px solid #dadce0; padding: 6px; font-size: 13px; min-width: 100px; height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Kolom Header & Nomor Baris */
        th { background: #f8f9fa; color: #5f6368; font-weight: normal; text-align: center; user-select: none; position: sticky; top: 0; z-index: 2; }
        td:first-child { background: #f8f9fa; color: #5f6368; text-align: center; font-size: 11px; min-width: 40px; max-width: 40px; width: 40px; position: sticky; left: 0; z-index: 1; border-right: 2px solid #ddd; }
        th:first-child { position: sticky; left: 0; top: 0; z-index: 3; border-right: 2px solid #ddd; width: 40px; }
        
        /* Fokus saat edit cell */
        td[contenteditable="true"]:focus { outline: 2px solid #1a73e8; background: #e8f0fe; z-index: 5; position: relative; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn" onclick="addRow()">+ Tambah Baris</button>
        <button class="btn" onclick="addColumn()">+ Tambah Kolom</button>
        <button class="btn btn-green" onclick="copyData()">📋 Copy Semua Data (untuk GSheet)</button>
    </div>

    <div class="table-container">
        <table id="spreadsheet">
            <thead>
                <tr id="headerRow">
                    <th></th> </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

<script>
    let totalRows = 15;
    let totalCols = 6;
    
    const headerRow = document.getElementById('headerRow');
    const tableBody = document.getElementById('tableBody');

    // Mengubah indeks angka menjadi huruf kolom (A, B, C, ... Z, AA, BB)
    function getColumnLabel(index) {
        let label = "";
        while (index >= 0) {
            label = String.fromCharCode((index % 26) + 65) + label;
            index = Math.floor(index / 26) - 1;
        }
        return label;
    }

    // Inisialisasi Tabel Pertama Kali
    function initTable() {
        // Buat Header Kolom (A, B, C...)
        for (let i = 0; i < totalCols; i++) {
            const th = document.createElement('th');
            th.innerText = getColumnLabel(i);
            headerRow.appendChild(th);
        }

        // Buat Baris dan Sel Data
        for (let i = 1; i <= totalRows; i++) {
            createRowElement(i);
        }
    }

    function createRowElement(rowNum) {
        const tr = document.createElement('tr');
        
        // Sel nomor baris (kolom pertama)
        const tdIndex = document.createElement('td');
        tdIndex.innerText = rowNum;
        tr.appendChild(tdIndex);

        // Sel data yang bisa diedit
        for (let j = 0; j < totalCols; j++) {
            const td = document.createElement('td');
            td.contentEditable = "true";
            tr.appendChild(td);
        }
        
        tableBody.appendChild(tr);
    }

    // Fungsi Tambah Baris
    function addRow() {
        totalRows++;
        createRowElement(totalRows);
    }

    // Fungsi Tambah Kolom
    function addColumn() {
        // Tambah di header
        const th = document.createElement('th');
        th.innerText = getColumnLabel(totalCols);
        headerRow.appendChild(th);

        // Tambah di setiap baris body
        const rows = tableBody.querySelectorAll('tr');
        rows.forEach(tr => {
            const td = document.createElement('td');
            td.contentEditable = "true";
            tr.appendChild(td);
        });

        totalCols++;
    }

    // Fungsi Ekstrak dan Copy Data ke Clipboard
    function copyData() {
        const rows = tableBody.querySelectorAll('tr');
        let tsvLines = [];

        rows.forEach(tr => {
            const cells = tr.querySelectorAll('td');
            let rowData = [];
            
            // Lewati cells[0] karena itu nomor baris otomatis
            for (let i = 1; i < cells.length; i++) {
                // Bersihkan spasi atau baris baru agar tidak merusak format tabel asli
                let text = cells[i].innerText.replace(/\n/g, " ").trim();
                rowData.push(text);
            }
            tsvLines.push(rowData.join("\t"));
        });

        const finalTsv = tsvLines.join("\n");

        navigator.clipboard.writeText(finalTsv).then(() => {
            alert("Semua data berhasil dicopy!\nSilakan buka Google Sheets Anda lalu tekan Ctrl+V.");
        }).catch(() => {
            alert("Gagal mengcopy data secara otomatis.");
        });
    }

    // Jalankan saat load
    initTable();
</script>

</body>
</html>
